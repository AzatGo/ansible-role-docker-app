---
- name: Check Docker host and logging settings
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['service_mgr'] == 'systemd'
      - docker_app_log_max_size is match('^[1-9][0-9]*[kmg]$')
      - docker_app_log_max_files | int > 0
    fail_msg: This role requires Ubuntu with systemd and valid Docker log limits.

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-apt
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Remove packages conflicting with Docker CE
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - docker-compose-v2
      - docker-doc
      - docker-buildx
      - podman-docker
      - containerd
      - runc
    state: absent

- name: Create APT key directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker repository key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Get package architecture
  ansible.builtin.command: dpkg --print-architecture
  register: docker_app_architecture
  changed_when: false
  check_mode: false

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_app_architecture.stdout }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
      {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present

- name: Install Docker and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Create Docker configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"

- name: Check existing Docker configuration
  ansible.builtin.stat:
    path: /etc/docker/daemon.json
  register: docker_app_daemon_stat

- name: Read existing Docker configuration
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: docker_app_daemon_file
  when: docker_app_daemon_stat.stat.exists

- name: Keep existing Docker settings
  ansible.builtin.set_fact:
    docker_app_existing_daemon: >-
      {{ docker_app_daemon_file.content | default('e30=') | b64decode | from_json }}

- name: Configure Docker JSON log rotation
  ansible.builtin.copy:
    content: |
      {{ docker_app_existing_daemon | combine({
        'log-driver': 'json-file',
        'log-opts': {
          'max-size': docker_app_log_max_size | string,
          'max-file': docker_app_log_max_files | string
        }
      }) | to_nice_json }}
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/dockerd --validate --config-file %s
  notify: Restart Docker

- name: Enable Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
