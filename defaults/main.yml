---
# Репозиторий клонируется на машине, с которой запускается Ansible.
docker_app_repo_url: https://github.com/AzatGo/test_app.git
docker_app_repo_version: "094b0213d2c583d96dc412a6073ee171d4b6f12b"
docker_app_source_dir: "{{ playbook_dir }}/.cache/test_app"
docker_app_project_dir: /opt/test_app
docker_app_project_name: test_app

# Порт приложения на хосте. Порт PostgreSQL наружу не публикуется.
docker_app_bind_address: "0.0.0.0"
docker_app_port: 8000
docker_app_ssh_port: "{{ ansible_port | default(22) }}"

# Переменные приложения из исходного Compose.
docker_app_postgres_db: notes
docker_app_postgres_user: notes
docker_app_postgres_password: ""  # Обязательно переопределить.
docker_app_name: notes
docker_app_log_level: INFO
docker_app_shutdown_delay: 3
docker_app_db_connect_timeout: 5

# Ротация JSON-логов Docker и обоих сервисов.
docker_app_log_max_size: 10m
docker_app_log_max_files: 3

# Ежедневный docker system prune -f, по часовому поясу хоста.
docker_app_prune_hour: "3"
docker_app_prune_minute: "0"

# Обновление контейнеров и ожидание готовности.
docker_app_stop_timeout: 75
docker_app_wait_timeout: 180
docker_app_legacy_containers: []
